name: Java CI

on:
  push:
    branches:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up git submodules
        run: git submodule init && git submodule update
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Build with Gradle
        run: ./gradlew build -x test -x longRunTest

      - name: Tar post-build state
        run: tar --exclude=./post-build.tar.gz -czf post-build.tar.gz *
      - name: Upload post-build state
        uses: actions/upload-artifact@v4
        with:
          name: post-build-state
          path: .

      - name: Upload compiled jars
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jars
          path: build/libs/*.jar

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Download post-build state
        uses: actions/download-artifact@v4
        with:
          name: post-build-state
          path: .
      - name: Untar post-build state
        run: tar -xvzf post-build.tar.gz

      - name: Run tests
        run: ./gradlew check -x longRunTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/

  longRunTest:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Download post-build state
        uses: actions/download-artifact@v4
        with:
          name: post-build-state
          path: post-build.tar.gz
      - name: Untar post-build state
        run: tar -xvzf post-build.tar.gz

      - name: Run tests
        run: ./gradlew check -x test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-test-reports
          path: build/reports/

  cleanup:
    runs-on: ubuntu-latest
    needs: [ test, longRunTest ]

    steps:
      - name: Delete temporary artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: post-build-state
